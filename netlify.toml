# Netlify yayın ayarları. Ortam değişkenleri (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY)
# Netlify panelinden girilir; bu dosyaya yazılmaz.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Tek sayfalık uygulama: bilinmeyen adresler index.html'e gider.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker ve manifest her zaman taze alınsın; yoksa güncelleme gecikir.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
